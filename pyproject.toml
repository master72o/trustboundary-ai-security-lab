[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trustboundary-ai-security-lab"
version = "1.0.0"
description = "TrustBoundary: Dual-Boundary LLM Safety & Red-Teaming Benchmark with Adversarial Ingress/Egress Firewalls"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "master72o" }]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["trustboundary*"]
